plugins {
    id 'com.enonic.xp.app'
}

java {
    toolchain {
        // XP 8.1 is compiled for Java 25 (class file version 69), so core-api can only be read by JDK 25.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Provided by XP at runtime, so they must not be packed into the app jar.
    compileOnly "com.enonic.xp:core-api:${xpVersion}"
    compileOnly "com.enonic.xp:script-api:${xpVersion}"

    testImplementation "com.enonic.xp:core-api:${xpVersion}"
    testImplementation "com.enonic.xp:script-api:${xpVersion}"
    // Executes the controller with XP's Java bridge and serializer, without starting a server.
    testImplementation "com.enonic.xp:testing:${xpVersion}"
    // Keep the JUnit engine aligned with the API used by XP's testing support.
    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    // The assignment says 5.17.0, but its Byte Buddy cannot instrument Java 25 classes
    // ("Java 25 (69) is not supported"). 5.24.0 is what XP 8.1.2 itself tests with.
    testImplementation "org.mockito:mockito-core:5.24.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo()
}

test {
    useJUnitPlatform()
}
